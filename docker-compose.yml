services:
  # ===== MySQL Database =====
  mysql:
    image: mysql:8.0
    container_name: gestorpro360-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-crm_imobiliario}
    ports:
      - "${DB_PORT:-3308}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gestorpro360

  # ===== Redis (cache, sessions, pub/sub, queues) =====
  redis:
    image: redis:7-alpine
    container_name: gestorpro360-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gestorpro360

  # ===== MinIO (S3-compatible file storage) =====
  minio:
    image: minio/minio
    container_name: gestorpro360-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - gestorpro360

  # ===== Backend (Node.js + Express + Prisma + Socket.io) =====
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gestorpro360-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql://root:${DB_PASSWORD:-root}@mysql:3306/${DB_NAME:-crm_imobiliario}
      JWT_SECRET: ${JWT_SECRET:-super_secret_jwt_key_change_me}
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:1234}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:1234}
      EVOLUTION_WEBHOOK_SECRET: ${EVOLUTION_WEBHOOK_SECRET:-change-this-in-production}
      REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-gestorpro360}
    ports:
      - "${BACKEND_PORT:-2000}:3000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/src:/app/src
      - ./backend/prisma:/app/prisma
    networks:
      - gestorpro360

  # ===== Frontend (React + Parcel) =====
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gestorpro360-frontend
    restart: unless-stopped
    environment:
      REACT_APP_API_URL: ${REACT_APP_API_URL:-http://localhost:2000}
    ports:
      - "${FRONTEND_PORT:-1234}:1234"
    depends_on:
      - backend
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    networks:
      - gestorpro360

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local

networks:
  gestorpro360:
    driver: bridge
